{% extends "base.html" %}

{% block title %}Page Not Found | 3D Marketplace{% endblock %}

{% block body %}
<div class="app-shell" style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:var(--space-8);">
  <div class="card" style="max-width:560px;width:100%;padding:var(--space-8);">
    <div class="sidebar__brand" style="margin-bottom:var(--space-6);padding:0;display:flex;align-items:center;gap:var(--space-3);">
      <div class="sidebar__brand-icon" aria-hidden="true" style="width:40px;height:40px;border-radius:10px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
          <line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
      </div>
      <div>
        <div class="sidebar__brand-name">3D Marketplace</div>
      </div>
    </div>
    <h1 style="margin:0 0 var(--space-3);font-size:var(--font-size-h2);">Page not found</h1>
    <p class="text-muted text-sm" style="margin-bottom:var(--space-6);">
      The page you were looking for doesn’t exist or may have moved.
    </p>
    <div style="display:flex;gap:var(--space-3);flex-wrap:wrap;">
      <a class="btn btn-primary" href="{{ url_for('index') }}">Back to Home</a>
      {% if current_user %}
        <a class="btn btn-secondary" href="{{ url_for('customer.dashboard') if current_user.role == 'customer' else url_for('manufacturer.dashboard') if current_user.role == 'manufacturer' else url_for('admin.dashboard') }}">Go to Dashboard</a>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
